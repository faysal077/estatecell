<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BSCIC Estate Management - Login</title>

    <!-- Bootstrap 5.3.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0f5132 0%,
                #198754 45%,
                #6ccf8d 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Segoe UI,
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;

            padding: 36px 32px;

            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);

            color: #fff;
        }

        .logo {
            width: 84px;
            height: 84px;

            border-radius: 50%;
            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .logo i {
            font-size: 2.2rem;
            color: #198754;
        }

        .form-control {
            border: none;
            border-radius: 14px;

            padding: 12px 14px;

            background: rgba(255, 255, 255, 0.92);
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.35);
        }

        .btn-login {
            background: #fff;
            color: #198754;

            border: none;
            border-radius: 14px;

            padding: 12px;

            font-weight: 700;

            transition: 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            background: #f3f7f5;
        }

        .footer {
            margin-top: 22px;

            text-align: center;

            font-size: 0.9rem;
            opacity: 0.95;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">
            <i class="bi bi-building-check"></i>
        </div>

        <!-- Title -->
        <h3 class="text-center fw-bold mb-1">
            BSCIC Estate Management
        </h3>

        

        <!-- Login Form -->
        <form method="POST">

            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <!-- Sign In Button -->
            <button
                type="submit"
                class="btn btn-login w-100"
            >
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            </button>

        </form>

        <!-- Django Messages -->
        {% for message in messages %}

            <div class="alert alert-warning mt-3 mb-0">
                {{ message }}
            </div>

        {% endfor %}

        <!-- Footer -->
<!--         
        <div class="footer">

            <div>
                কারিগরি সহায়তায়
            </div>

            <div class="fw-semibold">
                আইসিটি সেল, বিসিক, ঢাকা-১২০৮
            </div>

            <div>
                পরীক্ষামূলক সংস্করণ
            </div>

        </div> -->

    </div>

</body>

</html>
