{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-danger text-white">

            <h4 class="mb-0">

                <i class="bi bi-trash"></i>

                Confirm Delete

            </h4>

        </div>


        <div class="card-body">

            <p>
                Are you sure you want to delete
                <strong>
                    {{ land.office_name }}
                </strong>
                in
                <strong>
                    {{ land.district }}
                </strong>?
            </p>


            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">

                    <i class="bi bi-trash"></i>

                    Yes, Delete

                </button>


                <a
                    href="{% url 'AnotherLand:another_land_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
