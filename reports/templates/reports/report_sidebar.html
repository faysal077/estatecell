<div class="report-sidebar">

    <!-- =====================================================
         REPORT DASHBOARD
         ===================================================== -->

    <a
        href="{% url 'reports:rd_office_report' %}"
        class="report-menu-item
        {% if request.resolver_match.url_name == 'rd_office_report' %}active{% endif %}"
    >
        <i class="bi bi-speedometer2"></i>
        <span>Report Dashboard</span>
    </a>


    <!-- =====================================================
         RD OFFICE REPORT
         ===================================================== -->

    <!-- =====================================================
         BSCIC LAND STATUS
         ===================================================== -->

    <div
        class="report-menu-group
        {% if request.resolver_match.url_name == 'industrial_land_report' or request.resolver_match.url_name == 'non_industrial_land_report' or request.resolver_match.url_name == 'admin_verification_status' %}
            open
        {% endif %}"
    >

        <!-- Parent Menu -->

        <button
            type="button"
            class="report-menu-title"
            onclick="toggleReportMenu(this)"
        >

            <i class="bi bi-map"></i>

            <span>
                বিসিকের জমির হালনাগাদ তথ্য
            </span>

            <i class="bi bi-chevron-down report-menu-arrow"></i>

        </button>


        <!-- Sub Menu -->

        <div class="report-submenu">

            <!-- Industrial Land -->

            <a
                href="{% url 'reports:industrial_land_report' %}"
                class="report-submenu-item
                {% if request.resolver_match.url_name == 'industrial_land_report' %}active{% endif %}"
            >

                <i class="bi bi-buildings"></i>

                <span>
                    শিল্পনগরীর জমির তথ্য
                </span>

            </a>


            <!-- Non Industrial Land -->

            <a
                href="{% url 'reports:non_industrial_land_report' %}"
                class="report-submenu-item
                {% if request.resolver_match.url_name == 'non_industrial_land_report' %}active{% endif %}"
            >

                <i class="bi bi-geo-alt"></i>

                <span>
                    শিল্পনগরী বহির্ভূত জমির তথ্য
                </span>

            </a>
            <!-- Admin Verification Status -->

            <a
                href="{% url 'reports:admin_verification_status' %}"
                class="report-submenu-item
                {% if request.resolver_match.url_name == 'admin_verification_status' %}active{% endif %}"
            >

                <i class="bi bi-patch-check"></i>

                <span>
                    Admin verification status
                </span>

            </a>

        </div>

    </div>
