{% extends "base.html" %}


{% block content %}

<style>

/* =========================================================
   REPORT LAYOUT
   ========================================================= */

.report-layout {

    display: flex;

    min-height: calc(100vh - 180px);

    gap: 0;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.report-sidebar {

    width: 235px;

    min-width: 235px;

    background: linear-gradient(
        180deg,
        #073b2b 0%,
        #0b4d39 100%
    );

    color: #ffffff;

    padding: 10px 7px;

    box-shadow:
        2px 0 8px rgba(0, 0, 0, 0.08);

}


/* =========================================================
   COMMON MENU ITEM
   ========================================================= */

.report-menu-item,
.report-menu-title {

    display: flex;

    align-items: center;

    gap: 9px;

    width: 100%;

    min-height: 40px;

    padding: 8px 10px;

    margin-bottom: 3px;

    border-radius: 6px;

    color: #ffffff;

    text-decoration: none;

    font-size: 0.88rem;

    font-weight: 500;

    transition: all 0.2s ease;

}


/* Parent button */

.report-menu-title {

    border: none;

    background: transparent;

    cursor: pointer;

    text-align: left;

}


/* =========================================================
   ICON
   ========================================================= */

.report-menu-item > i:first-child,
.report-menu-title > i:first-child {

    width: 18px;

    min-width: 18px;

    text-align: center;

    font-size: 0.95rem;
}


/* =========================================================
   HOVER
   ========================================================= */

.report-menu-item:hover,
.report-menu-title:hover {

    background: rgba(255, 255, 255, 0.10);

    color: #ffffff;

}


/* =========================================================
   ACTIVE MAIN MENU
   ========================================================= */

.report-menu-item.active {

    background: rgba(255, 255, 255, 0.14);

    color: #ffffff;

    font-weight: 600;

}


/* =========================================================
   MENU GROUP
   ========================================================= */

.report-menu-group {

    margin: 3px 0;

}


/* =========================================================
   ARROW
   ========================================================= */

.report-menu-arrow {

    margin-left: auto;

    font-size: 0.75rem !important;

    transition: transform 0.2s ease;

}


/* =========================================================
   SUBMENU
   ========================================================= */

.report-submenu {

    display: none;

    padding: 2px 0 4px 27px;

}


/* Open submenu */

.report-menu-group.open .report-submenu {

    display: block;

}


/* Rotate arrow */

.report-menu-group.open .report-menu-arrow {

    transform: rotate(180deg);

}


/* =========================================================
   SUBMENU ITEM
   ========================================================= */

.report-submenu-item {

    display: flex;

    align-items: center;

    gap: 8px;

    width: 100%;

    padding: 7px 9px;

    margin: 2px 0;

    border-left: 2px solid rgba(255,255,255,0.18);

    border-radius: 0 5px 5px 0;

    color: rgba(255,255,255,0.85);

    text-decoration: none;

    font-size: 0.82rem;

    font-weight: 400;

    line-height: 1.4;

    transition: all 0.2s ease;

}


/* =========================================================
   SUBMENU HOVER
   ========================================================= */

.report-submenu-item:hover {

    background: rgba(255,255,255,0.10);

    color: #ffffff;

    border-left-color: #ffffff;

}


/* =========================================================
   ACTIVE SUBMENU
   ========================================================= */

.report-submenu-item.active {

    background: rgba(255,255,255,0.14);

    color: #ffffff;

    border-left-color: #ffffff;

    font-weight: 600;

}


/* =========================================================
   SUBMENU ICON
   ========================================================= */

.report-submenu-item i {

    width: 16px;

    min-width: 16px;

    text-align: center;

    font-size: 0.82rem;

}


/* =========================================================
   REPORT CONTENT
   ========================================================= */

.report-main {

    flex: 1;

    min-width: 0;

    padding: 22px 24px 35px;

    background: #f7f8f5;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 991px) {

    .report-layout {

        flex-direction: column;

    }


    .report-sidebar {

        width: 100%;

        min-width: 100%;

    }


    .report-main {

        padding: 18px 12px 30px;

    }

}

</style>


<div class="report-layout">

    {% include "reports/report_sidebar.html" %}


    <main class="report-main">

        {% block report_content %}

        {% endblock %}

    </main>

</div>


<script>

function toggleReportMenu(button) {

    const group = button.closest(".report-menu-group");

    group.classList.toggle("open");

}

</script>


{% endblock %}
